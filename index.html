    /* Фондағы жүректер басқа нәрсеге кедергі жасамайды */
    .heart-bg {
      position: fixed;
      color: rgba(255, 77, 109, 0.4);
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      z-index: 1;
      pointer-events: none !important;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.6);
        opacity: 0;
      }
      20% { opacity: 0.8; }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }
