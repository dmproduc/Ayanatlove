<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Саған арналған құпия тапсырма ✨</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #ffe4e6 0%, #fbcfe8 50%, #f472b6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      perspective: 1000px;
    }

    .bg-heart {
      position: fixed;
      color: rgba(255, 255, 255, 0.4);
      font-size: 20px;
      pointer-events: none;
      animation: floatUp 8s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0.8) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.3) rotate(360deg); opacity: 0; }
    }

    .card-container {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 30px 24px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(225, 29, 72, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      text-align: center;
      position: relative;
      transition: all 0.4s ease;
    }

    .step {
      display: none;
      animation: fadeIn 0.5s ease-out forwards;
    }

    .step.active {
      display: block;
    }
